aid: dailydealde
name: DailyDeal.de
description: DailyDeal.de is a German consumer deals, coupons, and discounts platform ("Deals, Gutscheine
  & Schnäppchen") that aggregates daily deals across categories including electronics, fashion, home and
  garden, beauty, kids, sports, and free-to-try product samples ("gratis testen"). Shoppers browse
  discounted products, brand vouchers, and shop-specific coupon codes, and read shopping guides in the
  site's Magazin. Originally founded in Berlin in 2009 and briefly owned by Google, DailyDeal today
  operates as a WordPress-based consumer commerce and content site and publishes no public developer API
  program. It was added to the API Evangelist network as an Insight Partners portfolio lead.
